<svg viewBox="0 0 980 1560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect width="980" height="1560" fill="white"/>

  <text x="490" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">
    Per-Grain Analysis Pipeline
  </text>

  <!-- ============ MAIN CHAIN BOXES ============ -->
  <!-- Box template: rounded rect + centered multi-line text -->

  <!-- 1. ROI selection -->
  <rect x="290" y="65" width="400" height="60" rx="10" fill="#eef2f7" stroke="#5b6b7d" stroke-width="1.6"/>
  <text x="490" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Manual ROI selection</text>
  <text x="490" y="110" text-anchor="middle" font-size="12" fill="#333333">one ROI ~ one candidate austenite grain</text>

  <line x1="490" y1="125" x2="490" y2="150" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 2. Clustering -->
  <rect x="270" y="150" width="440" height="70" rx="10" fill="#dcebfb" stroke="#2f6fad" stroke-width="1.6"/>
  <text x="490" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Misorientation-based sub-grain clustering</text>
  <text x="490" y="193" text-anchor="middle" font-size="12" fill="#333333">region growing (ang_thr, dmax, minidxs)</text>
  <text x="490" y="210" text-anchor="middle" font-size="12" fill="#333333">+ symmetry-branch consistency (symmetrize_clusters)</text>

  <line x1="490" y1="220" x2="490" y2="245" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 3. KAM/GND -->
  <rect x="270" y="245" width="440" height="70" rx="10" fill="#dcebfb" stroke="#2f6fad" stroke-width="1.6"/>
  <text x="490" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">3. Local misorientation and GND density</text>
  <text x="490" y="288" text-anchor="middle" font-size="12" fill="#333333">KAM vs. kernel radius, linear regression</text>
  <text x="490" y="305" text-anchor="middle" font-size="12" fill="#333333">(Kamaya 2011; Moussa et al. 2017)</text>

  <line x1="490" y1="315" x2="490" y2="340" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 4. homogeneous direction -->
  <rect x="270" y="340" width="440" height="70" rx="10" fill="#dcebfb" stroke="#2f6fad" stroke-width="1.6"/>
  <text x="490" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">4. Homogeneous lattice direction search</text>
  <text x="490" y="383" text-anchor="middle" font-size="12" fill="#333333">candidate &lt;100&gt;/&lt;110&gt;/&lt;111&gt; families, spread</text>
  <text x="490" y="400" text-anchor="middle" font-size="12" fill="#333333">minimized across ALL clusters -&gt; provisional zone axis</text>

  <line x1="490" y1="410" x2="490" y2="435" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 5. Twin/kink identification -->
  <rect x="250" y="435" width="480" height="80" rx="10" fill="#e2f3e6" stroke="#2f8a4c" stroke-width="1.6"/>
  <text x="490" y="460" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">5. Twin &amp; kink relationship identification</text>
  <text x="490" y="478" text-anchor="middle" font-size="12" fill="#333333">T-loop symmetric-branch search vs. tabulated {112}-{115} modes</text>
  <text x="490" y="495" text-anchor="middle" font-size="12" fill="#333333">+ blind low-index axis search (kink), pairwise over all clusters</text>

  <line x1="490" y1="515" x2="490" y2="540" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 6. Directed reconstruction -->
  <rect x="230" y="540" width="520" height="95" rx="10" fill="#e2f3e6" stroke="#2f8a4c" stroke-width="1.6"/>
  <text x="490" y="565" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">6. Directed parent-orientation reconstruction</text>
  <text x="490" y="583" text-anchor="middle" font-size="12" fill="#333333">twin edges directed by Schmid factor (axial_dir); kink edges undirected</text>
  <text x="490" y="600" text-anchor="middle" font-size="12" fill="#333333">breadth-first propagation from best source cluster</text>
  <text x="490" y="617" text-anchor="middle" font-size="12" fill="#333333">-&gt; pixel-weighted quaternion consensus = parent_mat</text>

  <line x1="490" y1="635" x2="490" y2="660" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 7. Verification -->
  <rect x="270" y="660" width="440" height="70" rx="10" fill="#e2f3e6" stroke="#2f8a4c" stroke-width="1.6"/>
  <text x="490" y="685" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">7. Verification vs. tabulated twin geometry</text>
  <text x="490" y="703" text-anchor="middle" font-size="12" fill="#333333">every real cluster re-tested against parent_mat</text>
  <text x="490" y="720" text-anchor="middle" font-size="12" fill="#333333">(as if parent_mat were a real orientation) + Schmid factors</text>

  <line x1="490" y1="730" x2="490" y2="755" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 8. Matrix merging -->
  <rect x="270" y="755" width="440" height="70" rx="10" fill="#e2f3e6" stroke="#2f8a4c" stroke-width="1.6"/>
  <text x="490" y="780" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">8. Matrix identification (orientation merging)</text>
  <text x="490" y="798" text-anchor="middle" font-size="12" fill="#333333">clusters with true minimum disorientation &lt; threshold</text>
  <text x="490" y="815" text-anchor="middle" font-size="12" fill="#333333">to parent_mat merged into one "Matrix" cluster</text>

  <line x1="490" y1="825" x2="490" y2="850" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 9. Consolidated report -->
  <rect x="270" y="850" width="440" height="70" rx="10" fill="#e2f3e6" stroke="#2f8a4c" stroke-width="1.6"/>
  <text x="490" y="875" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">9. Consolidated reconstruction report</text>
  <text x="490" y="893" text-anchor="middle" font-size="12" fill="#333333">Matrix / Twin OR / Kink OR / No-OR-found</text>
  <text x="490" y="910" text-anchor="middle" font-size="12" fill="#333333">pixel &amp; cluster accounting, per-mode Schmid factors</text>

  <line x1="490" y1="920" x2="490" y2="945" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 10. Martensite correspondence -->
  <rect x="250" y="945" width="480" height="95" rx="10" fill="#fdeee0" stroke="#c96a1f" stroke-width="1.6"/>
  <text x="490" y="970" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">10. Martensite correspondence &amp; variant selection</text>
  <text x="490" y="988" text-anchor="middle" font-size="12" fill="#333333">refined common direction -&gt; candidate correspondence variants</text>
  <text x="490" y="1005" text-anchor="middle" font-size="12" fill="#333333">variant selected by max. transformation strain along axial_dir</text>
  <text x="490" y="1022" text-anchor="middle" font-size="12" fill="#333333">-&gt; austenite twins checked against known martensite twin planes</text>

  <line x1="490" y1="1040" x2="490" y2="1065" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 11. checkpointing -->
  <rect x="290" y="1065" width="400" height="60" rx="10" fill="#eeeeee" stroke="#666666" stroke-width="1.6"/>
  <text x="490" y="1090" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">11. Checkpointing</text>
  <text x="490" y="1108" text-anchor="middle" font-size="12" fill="#333333">clustering + reconstruction results -&gt; per-grain HDF5</text>

  <!-- ============ CAVEAT CALLOUTS ============ -->

  <!-- caveat 1: ROI selection subjectivity -->
  <rect x="60" y="70" width="200" height="90" rx="8" fill="#fff4e5" stroke="#c96a1f" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="160" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a34e0e">Caveat</text>
  <text x="160" y="107" text-anchor="middle" font-size="10.5" fill="#4d3010">ROI choice is a manual,</text>
  <text x="160" y="121" text-anchor="middle" font-size="10.5" fill="#4d3010">subjective judgement --</text>
  <text x="160" y="135" text-anchor="middle" font-size="10.5" fill="#4d3010">may span &gt;1 real grain</text>
  <text x="160" y="149" text-anchor="middle" font-size="10.5" fill="#4d3010">or capture only part of one</text>
  <line x1="260" y1="115" x2="288" y2="95" stroke="#c96a1f" stroke-width="1.3" stroke-dasharray="3,2"/>

  <!-- caveat 2: directed-cycle fallback -->
  <rect x="750" y="545" width="200" height="105" rx="8" fill="#fff4e5" stroke="#c96a1f" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="850" y="565" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a34e0e">Caveat</text>
  <text x="850" y="582" text-anchor="middle" font-size="10.5" fill="#4d3010">pairwise-directed edges</text>
  <text x="850" y="596" text-anchor="middle" font-size="10.5" fill="#4d3010">can form a directed cycle --</text>
  <text x="850" y="610" text-anchor="middle" font-size="10.5" fill="#4d3010">no clean source cluster.</text>
  <text x="850" y="624" text-anchor="middle" font-size="10.5" fill="#4d3010">Fallback root used, flagged</text>
  <text x="850" y="638" text-anchor="middle" font-size="10.5" fill="#4d3010">via used_cycle_fallback</text>
  <line x1="750" y1="595" x2="722" y2="585" stroke="#c96a1f" stroke-width="1.3" stroke-dasharray="3,2"/>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(60,1145)">
    <rect x="0" y="0" width="860" height="60" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
    <rect x="18" y="15" width="18" height="14" rx="3" fill="#dcebfb" stroke="#2f6fad"/>
    <text x="42" y="26" font-size="11.5" fill="#333333">Data / structural analysis</text>

    <rect x="238" y="15" width="18" height="14" rx="3" fill="#e2f3e6" stroke="#2f8a4c"/>
    <text x="262" y="26" font-size="11.5" fill="#333333">Twin/kink identification &amp; graph reconstruction</text>

    <rect x="18" y="37" width="18" height="14" rx="3" fill="#fdeee0" stroke="#c96a1f"/>
    <text x="42" y="48" font-size="11.5" fill="#333333">Martensite correspondence</text>

    <rect x="238" y="37" width="18" height="14" rx="3" fill="#eeeeee" stroke="#666666"/>
    <text x="262" y="48" font-size="11.5" fill="#333333">I/O</text>

    <rect x="560" y="15" width="18" height="14" rx="3" fill="#fff4e5" stroke="#c96a1f" stroke-dasharray="4,2"/>
    <text x="584" y="26" font-size="11.5" fill="#333333">Known limitation / edge case</text>
  </g>

  <!-- ============ FOOTNOTE ============ -->
  <text x="490" y="1240" text-anchor="middle" font-size="11" fill="#777777">
    See accompanying methodology document for full description, equations, and references.
  </text>

</svg>
